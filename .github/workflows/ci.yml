name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: crm_whatsapp
      PGUSER: crm_app
      PGPASSWORD: ci_only_not_a_secret

    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_DB: crm_whatsapp
          POSTGRES_USER: crm_app
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_app -d crm_whatsapp"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run db:check
